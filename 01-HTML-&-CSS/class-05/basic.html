<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>basic</title>
</head>

<body>
    <h1>Job Application Form</h1>

    <fieldset>
        <legend>Job Application Form</legend>
        <form>
            <label for="fullname">fullname:</label>
            <input type="text" id="fullname" required> <br><br>

            <label for="email">email:</label>
            <input type="email" id="email" required> <br><br>

            <label for="phone-number">phone-number:</label>
            <input type="number" id="phone-number" required> <br><br>

            <label for="age">age:</label>
            <input type="number" id="age" min="20" max="40" required> <br><br>


            <label for="position">Position Applying For:</label>
            <select name="position" id="position">
                <option value="Mern stack">Mern stack</option>
                <option value="Graphic Designer">Graphic Designer</option>
                <option value="Digital Marketing">Digital Marketing</option>
                <option value="Video Editor">Video Editor</option>
                <option value="Cyber Security Expert">Cyber Security Expert</option>
                <option value="Backend Engineer">Backend Engineer</option>
            </select> <br><br>

            <label for="education">Education Level</label>
            <select name="education" id="education"></select> <br><br>

            <button type="submit">submit</button>
        </form>
    </fieldset>
</body>

</html>
